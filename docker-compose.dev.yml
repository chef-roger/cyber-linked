version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - cyberlink-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/cyberlink
      JWT_SECRET: dev-secret-key
      CLIENT_URL: http://localhost:3000
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - mongo
    networks:
      - cyberlink-net

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cyberlink-net

volumes:
  mongo_data_dev:

networks:
  cyberlink-net:
    driver: bridge
